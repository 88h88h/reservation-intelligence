<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reservation Intelligence - Book a table</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="diner">
  <div class="diner-topbar" style="justify-content: space-between;">
    <a href="/dine">&larr; All restaurants</a>
    <a href="/">Staff dashboard &rarr;</a>
  </div>

  <main class="diner-main">
    <section class="hero">
      <h1 id="restaurant-name">Reservation Intelligence</h1>
      <div class="vibe-block">
        <div class="vibe-label" id="vibe-label">&hellip;</div>
        <div class="occupancy-track">
          <div class="occupancy-fill" id="occupancy-fill" style="width: 0%"></div>
        </div>
        <div class="occupancy-dots" id="occupancy-dots"></div>
        <div class="occupancy-caption" id="occupancy-caption">Checking who's here&hellip;</div>
      </div>
    </section>

    <section id="offers-section" class="offers-strip" style="display: none;">
      <div id="offers-strip-list"></div>
    </section>

    <section class="diner-card">
      <h2>Book a table</h2>
      <form id="booking-form" class="stacked">
        <div>
          <label for="diner-user">Booking as</label>
          <select id="diner-user"></select>
        </div>
        <div class="field-row">
          <div>
            <label for="diner-date">Date</label>
            <input type="date" id="diner-date" required />
          </div>
          <div>
            <label for="diner-time">Time</label>
            <input type="time" id="diner-time" step="900" value="19:00" required />
          </div>
        </div>
        <div class="field-row">
          <div>
            <label for="diner-duration">Duration (minutes)</label>
            <select id="diner-duration">
              <option value="30">30</option>
              <option value="45">45</option>
              <option value="60" selected>60</option>
              <option value="90">90</option>
              <option value="120">120</option>
            </select>
          </div>
          <div>
            <label for="diner-party">Party size</label>
            <input type="number" id="diner-party" min="1" value="2" required />
          </div>
        </div>
        <button type="submit" class="primary block">Find a table</button>
      </form>
      <div id="diner-results" style="margin-top: 1rem;"></div>
    </section>
  </main>

  <script src="/static/dine.js"></script>
</body>
</html>
